services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]  # AOF everysec（03 §1 建议）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # mock FEED 上游（S7 全链冒烟：refresh_url 真源；挂载文件可改写模拟上游数据变更）
  mock-feed:
    image: ${PYTHON_IMAGE:-dockerproxy.net/library/python:3-alpine}
    working_dir: /srv
    volumes:
      - ./scripts/mock-feed.json:/srv/feed.json
      - ./scripts/serve.py:/srv/serve.py
    command: ["python", "serve.py"]

  app:
    build: .
    ports:
      - "9302:9302"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TR_API_KEY: ${TR_API_KEY:-dev-api-key}
      JWT_SECRET: ${JWT_SECRET:-tr-dev-secret-key-please-rotate-32ch}
      TR_REDISSON_ENABLED: ${TR_REDISSON_ENABLED:-true}   # 双实例评估器互斥（上线检查单 §部署）
    depends_on:
      redis:
        condition: service_healthy
      mock-feed:
        condition: service_started

  # 第二实例（上线检查单 §部署：双实例水平扩展；scripts/verify-ha.sh 实测评估器互斥）
  app2:
    build: .
    ports:
      - "9303:9302"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TR_API_KEY: ${TR_API_KEY:-dev-api-key}
      JWT_SECRET: ${JWT_SECRET:-tr-dev-secret-key-please-rotate-32ch}
      TR_REDISSON_ENABLED: ${TR_REDISSON_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      mock-feed:
        condition: service_started

  # 嵌入式最小宿主示例（docs/用户文档/03_嵌入式SDK接入指南.md）：
  # docker compose run --rm embedded-demo（--profile demo 激活；starter 进程内直调闭环）
  embedded-demo:
    build:
      context: .
      dockerfile: examples/embedded-demo/Dockerfile
    profiles: ["demo"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TR_FEED_URL: http://mock-feed:8000/feed
    depends_on:
      redis:
        condition: service_healthy
      mock-feed:
        condition: service_started
